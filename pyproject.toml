[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "options-copilot-local"
version = "0.1.0"
description = "Local, review-only US equity options research and scanning application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=42",
  "fastapi>=0.110",
  "ib-insync>=0.9.86",
  "pydantic>=2.6",
  "pywin32>=306; sys_platform == 'win32'",
  "tzdata>=2024.1; sys_platform == 'win32'",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["options_copilot*"]

[tool.setuptools.package-data]
options_copilot = [
  "frontend/*",
  "governance/*.json",
  "operations/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests/options_copilot"]
addopts = "-ra"
