[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "options-copilot"
version = "2.0.0"
description = "Local daily option screener: news -> views -> IBKR read-only quotes -> ranked defined-risk ideas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "ib-insync>=0.9.86",
  "numpy>=1.26",
  "tzdata>=2024.1; sys_platform == 'win32'",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["copilot*"]

[tool.setuptools.package-data]
copilot = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests/copilot"]
pythonpath = ["."]
addopts = "-ra"
